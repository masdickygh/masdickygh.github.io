<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dicky Prasetya - Fresh Graduate Teknik Informatika</title>
<meta name="description" content="Portofolio Dicky Prasetya, fresh graduate Teknik Informatika.">
<style>
:root{--bg:#fff;--soft:#f4f6fa;--ink:#0f172a;--mute:#52607a;--line:#e3e8f0;--acc:#2563eb;--tint:color-mix(in srgb,var(--acc) 10%,transparent);--ok:#16a34a;--serif:ui-serif,"Iowan Old Style",Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html[data-theme=dark]{--bg:#0b1120;--soft:#111a2e;--ink:#e8edf7;--mute:#9aa8c2;--line:#22304a}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--sans);transition:background .3s,color .3s}
a{color:var(--acc)}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.w{max-width:1080px;margin:0 auto;padding:0 24px}
nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .3s}
nav.sc{border-bottom-color:var(--line)}
.nb{display:flex;align-items:center;gap:6px;height:64px}
.logo{font:700 20px var(--serif);color:var(--ink);text-decoration:none;margin-right:auto}
nav a.l{color:var(--mute);text-decoration:none;font-size:15px;padding:6px 10px;border-radius:8px}
nav a.l:hover{color:var(--ink);background:var(--soft)}
button,.btn{font:inherit;font-size:15px;font-weight:600;padding:9px 18px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:transform .2s,box-shadow .2s,border-color .2s}
button:hover,.btn:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:0 6px 18px rgba(37,99,235,.14)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.ic{padding:9px 12px}
.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:56px;align-items:center;padding:72px 0 56px}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;padding:5px 14px;border-radius:30px;background:var(--tint);color:var(--acc);margin-bottom:20px}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(22,163,74,.6);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
h1{font:700 clamp(40px,6vw,68px)/1.05 var(--serif);letter-spacing:-.02em;margin:0 0 14px}
.st{font-size:clamp(19px,2.3vw,25px);line-height:1.4;font-weight:600;margin:0 0 16px;max-width:24em}
.bio{color:var(--mute);max-width:36em;margin:0 0 26px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.meta{margin-top:22px;color:var(--mute);font-size:15px}
.ph{position:relative;width:min(320px,80%);aspect-ratio:4/5;margin-left:auto}
.ph:before{content:"";position:absolute;inset:18px -18px -18px 18px;border-radius:28px;background:var(--tint);border:2px solid var(--acc);opacity:.7}
.pi{position:absolute;inset:0;border-radius:28px;overflow:hidden;background:linear-gradient(150deg,var(--acc),#0f172a);display:grid;place-items:center;font:700 84px var(--serif);color:#fff}
.pi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));border:1px solid var(--line);border-radius:20px;background:var(--soft);margin-bottom:24px}
.stat{padding:28px 26px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat b{display:block;font:700 44px/1.1 var(--serif);color:var(--acc)}
.stat span{color:var(--mute);font-size:15px}
section{padding:64px 0}
h2{font:700 clamp(28px,4vw,40px)/1.15 var(--serif);letter-spacing:-.01em;margin:0 0 8px}
.sec-s{color:var(--mute);margin:0 0 32px}
h3{font-size:19px;line-height:1.35;margin:0}
p{margin:0 0 10px}
.card{border:1px solid var(--line);border-radius:20px;background:var(--bg);transition:transform .3s,box-shadow .3s,border-color .3s}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(15,23,42,.1);border-color:var(--acc)}
.proj{display:grid;grid-template-columns:300px 1fr;overflow:hidden;margin-bottom:24px}
.th{background:linear-gradient(135deg,var(--acc),#0f172a);min-height:200px;position:relative}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pb{padding:26px 28px}
.yr{color:var(--acc);font-size:14px;font-weight:600;margin:0 0 2px}
.case{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:16px 0}
.case div{font-size:15px;color:var(--mute)}
.case b{display:block;color:var(--ink);font-size:13px;margin-bottom:2px}
.case .rs{background:var(--tint);border-radius:12px;padding:10px 12px;color:var(--ink)}
.case .rs b{color:var(--acc)}
.tg{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.tg li{font-size:13px;padding:2px 11px;border-radius:20px;background:var(--soft);color:var(--mute)}
.lk a{margin-right:16px;font-weight:600;font-size:15px}
.row{display:grid;grid-template-columns:200px 1fr;gap:24px;padding:24px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .d{color:var(--mute);font-size:15px}
.row ul{margin:8px 0 0;padding-left:20px;color:var(--mute)}
.row li{margin-bottom:3px}
.org{color:var(--mute);margin:0 0 4px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.sk{padding:24px}
.sk h3{margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:48px}
.it{padding:0 0 18px}
.q{padding:26px}
.q p{font:italic 18px/1.6 var(--serif)}
.q span{color:var(--mute);font-size:15px}
.ct{background:var(--soft);border-radius:28px;padding:56px 40px;text-align:center}
.ct p{max-width:34em;margin:0 auto 24px;color:var(--mute)}
.ct .cta{justify-content:center}
.fab{position:fixed;right:20px;bottom:20px;z-index:25;box-shadow:0 10px 28px rgba(37,99,235,.35)}
footer{padding:36px 0 90px;color:var(--mute);font-size:14px;text-align:center}
.rv{opacity:0;transform:translateY(28px);transition:opacity .8s,transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i,0)*80ms)}
.rv.in{opacity:1;transform:none}
.hero .rv{transition-delay:calc(var(--i,0)*110ms)}
.two{grid-template-columns:1fr;gap:44px}.egrid,.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:26px;align-items:start}.cgrid .it,.egrid .it{padding:0}.cgrid .wide{grid-column:1/-1}.it .org{text-align:left}.cgrid .wide .cpair{gap:16px}
.cpair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.cpair .cimg{margin-bottom:0}
.th img[data-zoom]{cursor:zoom-in;object-fit:contain;background:#fff}.cimg{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:12px;border:1px solid var(--line);margin-bottom:10px;cursor:zoom-in}.cimg.pt{aspect-ratio:4/5;max-width:190px;object-position:top}.lb{position:fixed;inset:0;background:rgba(0,0,0,.86);display:grid;place-items:center;z-index:50;padding:20px;cursor:zoom-out}.lb img{max-width:100%;max-height:100%;border-radius:10px}
.bio,.pb p,.row li,.it p,.sec-s,.ab p{text-align:justify;text-justify:inter-word;hyphens:auto;-webkit-hyphens:auto}
@media(max-width:520px){.bio,.pb p,.row li,.it p,.sec-s,.ab p{text-align:left}}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.mb{display:none}
.menu{display:flex;align-items:center;gap:2px}
nav a.l{display:inline-flex;align-items:center;gap:7px}
nav a.l.on{color:var(--acc);background:var(--tint)}
.nb{position:relative}
.hi{display:inline-grid;place-items:center;flex:none;width:44px;height:44px;border-radius:12px;background:var(--tint);color:var(--acc)}
.hi svg{width:24px;height:24px}
.hi.s{width:34px;height:34px;border-radius:10px}.hi.s svg{width:18px;height:18px}
h2{display:flex;align-items:center;gap:14px}
.ct h2{display:block}.ct .hi{margin-bottom:14px}
.ih{display:flex;align-items:center;gap:10px}
.btn svg{flex:none}
.ab{display:grid;grid-template-columns:1.2fr .8fr;gap:36px;align-items:start}
.ab p{font-size:17px}
.facts{list-style:none;margin:0;padding:24px;display:grid;gap:18px}
.facts li{display:flex;gap:14px;align-items:flex-start}
.facts b{display:block;font-size:14px;color:var(--mute);font-weight:600}
.facts div span{display:block;line-height:1.5}
@media(max-width:860px){.mb{display:inline-flex}.menu{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;align-items:stretch;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 18px 40px rgba(15,23,42,.14)}.menu.open{display:flex}nav a.l{padding:12px 14px;font-size:16px}.ab{grid-template-columns:1fr;gap:20px}}
#cv{display:none}
@media(max-width:860px){.hero{grid-template-columns:1fr;padding-top:40px;gap:36px}.ph{margin:0 auto 0 0;width:240px}.proj{grid-template-columns:1fr}.th{min-height:170px}.case{grid-template-columns:1fr}.row{grid-template-columns:1fr;gap:6px}.two{grid-template-columns:1fr;gap:8px}.stat{border-left:0;border-top:1px solid var(--line)}.stat:first-child{border-top:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
@media print{
@page{size:A4;margin:15mm}
body>*:not(#cv){display:none!important}
body{background:#fff;color:#000}
#cv{display:block;font:11pt/1.4 Arial,Helvetica,sans-serif;color:#000}
#cv h1{font:700 20pt/1.2 Arial,sans-serif;letter-spacing:0;margin:0 0 3pt}
#cv h2{font:700 12pt/1.3 Arial,sans-serif;letter-spacing:0;margin:12pt 0 4pt;padding-bottom:2pt;border-bottom:1px solid #000}
#cv p{margin:0 0 3pt;max-width:none;color:#000}
#cv ul{margin:2pt 0 6pt;padding-left:16pt}
#cv .ci{break-inside:avoid;margin-bottom:6pt}
}
</style>
</head>

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const lis = s => t(s).split("\n").filter(Boolean).map(x => `<li>${esc(x)}</li>`).join("");
const fmt = d => { if (!d) return ""; const p = String(d).split("-"); if (p.length < 2) return p[0];
  return new Date(+p[0], +p[1] - 1, 1).toLocaleDateString(lang === "id" ? "id-ID" : "en-US", { month: "short", year: "numeric" }); };
const range = (s, e, u) => fmt(s) + (s ? " - " : "") + (e ? fmt(e) : u.now);
const safe = u => /^https?:\/\//i.test(u || "");
const bare = s => String(s).replace(/^https?:\/\/(www\.)?/i, "").replace(/\/$/, "");
const a = (u, txt) => { if (!u || !(safe(u) || /^\//.test(u))) return ""; const isPdf = /\.pdf(?:[?#].*)?$/i.test(u); return `<a href="${esc(u)}"${isPdf ? " download" : " target=\"_blank\" rel=\"noopener\""}>${txt}</a>`; };

const IC = {
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2 20v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1M16 4.5a3.5 3.5 0 0 1 0 7M22 20v-1a5 5 0 0 0-3.5-4.8"/>',
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  briefcase: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/>',
  zap: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  cap: '<path d="M22 10 12 5 2 10l10 5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/>',
  award: '<circle cx="12" cy="9" r="6"/><path d="m8.5 14-1.5 8 5-3 5 3-1.5-8"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  chat: '<path d="M21 12a8 8 0 0 1-11.9 7L3 21l2-6A8 8 0 1 1 21 12z"/>',
  cpu: '<rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>',
  heart: '<path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/>',
  pin: '<path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  star: '<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
  download: '<path d="M12 3v12m0 0 4-4m-4 4-4-4M4 21h16"/>',
  moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>'
};
const ic = (n, z) => `<svg viewBox="0 0 24 24" width="${z || 18}" height="${z || 18}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n] || ""}</svg>`;
const SI = { about: "user", projects: "folder", experience: "briefcase", skills: "zap", education: "cap", testimonials: "star", contact: "mail" };
const SEC = {
  about: (u, P) => `<div class="ab"><div>${t(DATA.about.text).split("\n").filter(Boolean).map(x => `<p class="rv">${esc(x)}</p>`).join("")}</div>
    <ul class="facts card rv">${DATA.about.facts.map(f => `<li><span class="hi s">${ic(f.icon)}</span><div><b>${esc(t(f.k))}</b><span>${esc(t(f.v))}</span></div></li>`).join("")}</ul></div>`,
  projects: u => DATA.projects.map(p => `<article class="card proj rv"><div class="th">${p.img ? `<img src="${esc(p.img)}" alt="${esc(t(p.title))}" loading="lazy" onerror="this.remove()"${p.zoom ? " data-zoom" : ""}>` : ""}</div>
    <div class="pb"><p class="yr">${esc(p.year || "")}</p><h3>${esc(t(p.title))}</h3>
    ${t(p.problem) || t(p.action) || t(p.result) ? `<div class="case"><div><b>${u.prob}</b>${esc(t(p.problem))}</div><div><b>${u.act}</b>${esc(t(p.action))}</div><div class="rs"><b>${u.res}</b>${esc(t(p.result))}</div></div>` : ""}${t(p.desc) ? `<p>${esc(t(p.desc))}</p>` : ""}
    ${p.tags && p.tags.length ? `<ul class="tg">${p.tags.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    <p class="lk" style="margin-top:12px">${a(p.video, u.vid)} ${a(p.link, esc(t(p.linkLabel)) || u.site)} ${a(p.repo, u.repo)}</p></div></article>`).join(""),
  experience: u => DATA.experience.map(i => `<div class="row rv"><div class="d">${esc(i.when != null ? t(i.when) : range(i.start, i.end, u))}</div><div><h3>${esc(t(i.title))}</h3><p class="org">${esc(i.org)}</p>${t(i.desc) ? `<ul>${lis(i.desc)}</ul>` : ""}</div></div>`).join(""),
  skills: () => `<div class="g3">${DATA.skills.map((g, gi) => `<div class="card sk rv"><h3 class="ih"><span class="hi s">${ic(["users", "cpu", "heart", "zap"][gi % 4])}</span>${esc(t(g.cat))}</h3><ul class="tg">${g.items.map(x => `<li>${esc(t(x))}</li>`).join("")}</ul></div>`).join("")}</div>`,
  education: u => `<div class="two"><div><h3 class="ih" style="margin-bottom:16px"><span class="hi s">${ic("cap")}</span>${u.edu}</h3><div class="egrid">${DATA.education.map(i => `<div class="it rv">${i.img ? `<img class="cimg pt" src="${esc(i.img)}" alt="${esc(i.title)}" loading="lazy">` : ""}<h3>${esc(i.title)}</h3><p class="org">${esc(t(i.sub))} | ${esc(range(i.start, i.end, u))}</p>${t(i.desc) ? `<p>${esc(t(i.desc))}</p>` : ""}</div>`).join("")}</div></div>
    <div><h3 class="ih" style="margin-bottom:16px"><span class="hi s">${ic("award")}</span>${u.cert}</h3><div class="cgrid">${DATA.certificates.map(c => `<div class="it rv${c.img2 ? " wide" : ""}">${c.img ? `<div class="${c.img2 ? "cpair" : ""}"><img class="cimg" src="${esc(c.img)}" alt="${esc(t(c.title))}" loading="lazy">${c.img2 ? `<img class="cimg" src="${esc(c.img2)}" alt="${esc(t(c.title))} (lampiran)" loading="lazy">` : ""}</div>` : ""}<h3>${esc(t(c.title))}</h3><p class="org">${esc(t(c.issuer))}${c.date ? " | " + esc(fmt(c.date)) : ""} ${a(c.url, "&#8599;")}</p>${t(c.desc) ? `<p>${esc(t(c.desc))}</p>` : ""}</div>`).join("")}</div></div></div>`,
  testimonials: () => `<div class="g3">${DATA.testimonials.map(q => `<div class="card q rv"><p>&ldquo;${esc(t(q.quote))}&rdquo;</p><span>${esc(q.by)}, ${esc(t(q.role))}</span></div>`).join("")}</div>`,
  contact: (u, P) => `<div class="ct rv"><span class="hi">${ic("mail")}</span><h2>${u.ctT}</h2><p>${u.ctP}</p><div class="cta">
    ${P.email ? `<a class="btn p" href="mailto:${esc(P.email)}">${ic("mail")}${esc(P.email)}</a>` : ""}${P.whatsapp ? `<a class="btn" href="https://wa.me/${esc(P.whatsapp)}" target="_blank" rel="noopener">${ic("chat")}${u.wa}</a>` : ""}
    ${(P.socials || []).filter(s => safe(s.url)).map(s => `<a class="btn" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`).join("")}</div></div>`
};
const HAS = { about: () => !!DATA.about, projects: () => DATA.projects.length, experience: () => DATA.experience.length, skills: () => DATA.skills.length,
  education: () => DATA.education.length || DATA.certificates.length, testimonials: () => (DATA.testimonials || []).length, contact: () => 1 };
const SUB = { projects: "subP" };

/* CV ATS (hanya tampil saat cetak/PDF): satu kolom, teks asli, judul standar */
function buildCV(u, P) {
  const h = u.cvh, S = (n, b) => b ? `<section><h2>${n}</h2>${b}</section>` : "";
  const item = (x, y, d, ds) => `<div class="ci"><p><b>${esc(x)}</b>${y ? ", " + esc(y) : ""}${d ? " | " + esc(d) : ""}</p>${ds ? `<ul>${ds}</ul>` : ""}</div>`;
  const contact = [P.location, P.email, P.whatsapp ? "+" + P.whatsapp : "", ...(P.socials || []).filter(s => safe(s.url)).map(s => bare(s.url))].filter(Boolean).map(esc).join(" | ");
  return `<h1>${esc(P.name)}</h1><p>${esc(t(P.role))}</p><p>${contact}</p>` + S(h.sum, `<p>${esc(t(P.bio))}</p>`) +
    S(h.skills, DATA.skills.map(g => `<p><b>${esc(t(g.cat))}:</b> ${g.items.map(x => esc(t(x))).join(", ")}</p>`).join("")) +
    S(h.exp, DATA.experience.map(i => item(t(i.title), i.org, i.when != null ? t(i.when) : range(i.start, i.end, u), lis(i.desc))).join("")) +
    S(h.proj, DATA.projects.map(p => item(t(p.title), "", p.year, `<li>${esc(t(p.result))}</li>${p.tags && p.tags.length ? `<li>${u.tools}: ${p.tags.map(esc).join(", ")}</li>` : ""}`)).join("")) +
    S(h.edu, DATA.education.map(i => item(i.title, t(i.sub), range(i.start, i.end, u), lis(i.desc))).join("")) +
    S(h.cert, DATA.certificates.map(c => item(t(c.title), t(c.issuer), fmt(c.date), t(c.desc) ? `<li>${esc(t(c.desc))}</li>` : "")).join(""));
}
function setMeta(P) {
  const ld = { "@context": "https://schema.org", "@type": "Person", name: P.name, jobTitle: t(P.role), description: t(P.bio), email: P.email || undefined, address: P.location || undefined,
    sameAs: (P.socials || []).map(s => s.url).filter(safe), knowsAbout: DATA.skills.flatMap(g => g.items.map(x => t(x))) };
  let el = document.getElementById("ld");
  if (!el) { el = document.createElement("script"); el.type = "application/ld+json"; el.id = "ld"; document.head.appendChild(el); }
  el.textContent = JSON.stringify(ld).replace(/</g, "\\u003c");
  const md = document.querySelector("meta[name=description]"); if (md) md.content = t(P.bio).slice(0, 155);
}

let io;
function render() {
  const u = UI[lang], P = DATA.profile, keys = DATA.sections.filter(k => SEC[k] && HAS[k]());
  const ini = P.name.split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();
  document.documentElement.lang = lang; document.title = t(DATA.seo.title) || P.name;
  

  document.getElementById("nav").innerHTML = `<div class="w nb"><a class="logo" href="#top">${esc(ini)}</a>
    <div class="menu" id="mn">${keys.filter(k => k !== "testimonials").map(k => `<a class="l" href="#${k}">${ic(SI[k] || "star", 16)}${k === "about" ? u.about : u[k].split(" ")[0]}</a>`).join("")}</div>
    ${DATA.langs.length > 1 ? `<button id="bl" class="ic" type="button" aria-label="Language">${lang === "id" ? "EN" : "ID"}</button>` : ""}<button id="bt" class="ic" type="button" aria-label="Theme">${ic("moon", 18)}</button><button id="bm" class="ic mb" type="button" aria-label="Menu" aria-expanded="false">${ic("menu", 20)}</button></div>`;

  document.getElementById("hero").innerHTML = `<div id="top">${DATA.openToWork ? `<span class="badge rv" style="--i:0"><i></i>${u.open}</span>` : ""}
    <h1 class="rv" style="--i:1">${esc(P.name)}</h1><p class="st rv" style="--i:2">${esc(t(P.headline))}</p><p class="bio rv" style="--i:3">${esc(t(P.bio))}</p>
    <div class="cta rv" style="--i:4"><a class="btn p" href="#contact">${ic("chat")}${u.hire}</a></div><p class="meta rv" style="--i:5">${esc(t(P.role))} | ${esc(P.location)}</p></div>
    <div class="ph rv" style="--i:3"><div class="pi"><span>${esc(ini)}</span>${P.photo ? `<img src="${esc(P.photo)}" alt="${esc(P.name)}" onerror="this.remove()">` : ""}</div></div>`;

  document.getElementById("stats").innerHTML = (DATA.stats || []).length ? `<div class="stats rv">${DATA.stats.map(s =>
    `<div class="stat"><b data-n="${+s.n}" data-s="${esc(s.suf || "")}">${RM ? s.n + esc(s.suf || "") : "0" + esc(s.suf || "")}</b><span>${esc(t(s.label))}</span></div>`).join("")}</div>` : "";

  document.getElementById("app").innerHTML = keys.map(k => k === "contact" ? `<section id="contact">${SEC.contact(u, P)}</section>` :
    `<section id="${k}"><h2 class="rv"><span class="hi">${ic(SI[k] || "star")}</span>${u[k]}</h2>${SUB[k] ? `<p class="sec-s rv">${u[SUB[k]]}</p>` : `<div style="height:24px"></div>`}${SEC[k](u, P)}</section>`).join("") +
    `<a class="btn p fab" href="#contact">${ic("chat")}${u.hire}</a>`;
  document.getElementById("ft").innerHTML = `&copy; ${new Date().getFullYear()} ${esc(P.name)}`;
  document.getElementById("cv").innerHTML = buildCV(u, P); setMeta(P);

  document.querySelectorAll("section").forEach(s => s.querySelectorAll(".rv").forEach((el, i) => el.style.setProperty("--i", Math.min(i, 5))));
  if (io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting) return; e.target.classList.add("in"); io.unobserve(e.target);
    if (!RM) e.target.querySelectorAll("[data-n]").forEach(c => { const to = +c.dataset.n, s = c.dataset.s, t0 = performance.now(), dec = String(to).includes(".") ? 2 : 0;
      (function f(now) { const p = Math.min(1, (now - t0) / 1300), v = to * (1 - Math.pow(1 - p, 3)); c.textContent = (dec ? v.toFixed(dec) : Math.round(v)) + s; if (p < 1) requestAnimationFrame(f); })(t0); }); }), { threshold: .15 });
  document.querySelectorAll(".rv").forEach(el => io.observe(el));

  const bm = document.getElementById("bm"), mn = document.getElementById("mn");
  const shut = () => { mn.classList.remove("open"); bm.setAttribute("aria-expanded", "false"); bm.innerHTML = ic("menu", 20); };
  bm.onclick = () => { const o = mn.classList.toggle("open"); bm.setAttribute("aria-expanded", String(o)); bm.innerHTML = ic(o ? "x" : "menu", 20); };
  mn.onclick = e => { if (e.target.closest("a")) shut(); };
  const bl = document.getElementById("bl");
  if (bl) bl.onclick = () => { lang = lang === "id" ? "en" : "id"; try { localStorage.setItem("porto-lang", lang); } catch (e) {} render(); };
  document.getElementById("bt").onclick = () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark"; try { localStorage.setItem("porto-theme", r.dataset.theme); } catch (e) {} };
  const bp = document.getElementById("bp"); if (bp) bp.onclick = () => print();
}
document.addEventListener("click", e => { const im = e.target; if (!im.classList || !(im.classList.contains("cimg") || (im.dataset && "zoom" in im.dataset))) return; const lb = document.createElement("div"); lb.className = "lb"; const g = new Image(); g.src = im.src; g.alt = im.alt; lb.appendChild(g); lb.onclick = () => lb.remove(); document.body.appendChild(lb); });
document.addEventListener("keydown", e => { if (e.key === "Escape") document.querySelectorAll(".lb").forEach(x => x.remove()); });
render();
const spy = () => { let cur = ""; document.querySelectorAll("#app section").forEach(sec => { if (sec.getBoundingClientRect().top <= 140) cur = sec.id; });
  document.querySelectorAll("nav a.l").forEach(l => l.classList.toggle("on", l.getAttribute("href") === "#" + cur)); };
addEventListener("scroll", () => { document.getElementById("nav").classList.toggle("sc", scrollY > 8); spy(); }, { passive: true });

/* ============ Latar 3D bertema Teknik Informatika: jaringan komputer + paket data + kubus + simbol kode ============ */
(() => {
  const cv = document.getElementById("gl"), x = cv.getContext("2d"), dpr = Math.min(devicePixelRatio || 1, 2);
  let W, H, mx = 0, my = 0, sy = 0, AL = 1;
  const rs = () => { W = innerWidth; H = innerHeight; AL = W < 700 ? .45 : 1; cv.width = W * dpr; cv.height = H * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0); if (RM) fr(0); };
  const edges = (v, d) => { const e = []; for (let i = 0; i < v.length; i++) for (let j = i + 1; j < v.length; j++) {
    const a = v[i], b = v[j]; if (Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]) < d) e.push([i, j]); } return e; };
  const net = (n, d) => { const v = [], g = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < n; i++) { const y = 1 - 2 * (i + .5) / n, r = Math.sqrt(1 - y * y), a = i * g; v.push([Math.cos(a) * r, y, Math.sin(a) * r]); }
    return { v, e: edges(v, d), net: true }; };
  const cube = (() => { const v = []; for (const a of [-1, 1]) for (const b of [-1, 1]) for (const c of [-1, 1]) v.push([a, b, c]); return { v, e: edges(v, 2.1) }; })();
  const O = [
    { m: net(70, .62), p: [.72, .36], f: .30, k: .22, r: [.00016, .00010] },
    { m: net(30, .95), p: [.10, .92], f: .15, k: .40, r: [.00022, .00014] },
    { m: cube, p: [.90, .84], f: .06, k: .50, r: [.00040, .00030] },
    { m: cube, p: [.22, .30], f: .045, k: .35, r: [.00035, .00045] },
    { m: cube, p: [.55, .66], f: .035, k: .18, r: [.00050, .00030] }
  ].map(o => Object.assign(o, { a: Math.random() * 6, b: Math.random() * 6, pk: o.m.net ? Array.from({ length: 9 }, () => ({ e: Math.floor(Math.random() * o.m.e.length), t: Math.random(), v: .0004 + Math.random() * .0006 })) : [] }));
  const G = ["</>", "{ }", "01", "#", "&&", "git", "SQL", "if()", "10", "[ ]"].map((t, i) => ({ t, x: Math.random(), y: Math.random(), k: .12 + Math.random() * .3, s: 12 + Math.random() * 10, ph: Math.random() * 6, i }));
  const hex = h => { const n = parseInt(h.replace("#", ""), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  function draw(o, dt, dark, c) {
    o.a += o.r[0] * dt; o.b += o.r[1] * dt;
    const ca = Math.cos(o.a), sa = Math.sin(o.a), cb = Math.cos(o.b), sb = Math.sin(o.b), L = H * 1.7, S = Math.min(W, H) * o.f * (W < 700 ? .8 : 1);
    const cx = o.p[0] * W - mx * 80 * o.k, cy = ((((o.p[1] * H - sy * o.k + H * .3) % L) + L) % L) - H * .3 - my * 80 * o.k;
    const pts = o.m.v.map(v => { const X = v[0] * ca + v[2] * sa, Z0 = -v[0] * sa + v[2] * ca, Y = v[1] * cb - Z0 * sb, Z = v[1] * sb + Z0 * cb, k = 2.6 / (2.6 + Z);
      return [cx + X * S * k, cy + Y * S * k, k]; });
    const rgb = c.join(",");
    x.strokeStyle = `rgba(${rgb},${(dark ? .42 : .2) * AL})`; x.lineWidth = o.m.net ? 1 : 1.4; x.beginPath();
    o.m.e.forEach(([i, j]) => { x.moveTo(pts[i][0], pts[i][1]); x.lineTo(pts[j][0], pts[j][1]); }); x.stroke();
    if (o.m.net) {
      x.fillStyle = `rgba(${rgb},${(dark ? .8 : .55) * AL})`; pts.forEach(q => { x.beginPath(); x.arc(q[0], q[1], 1.4 * q[2] + .6, 0, 6.2832); x.fill(); });
      x.fillStyle = "#f59e0b"; o.pk.forEach(k => { k.t += k.v * dt; if (k.t > 1) { k.t = 0; k.e = Math.floor(Math.random() * o.m.e.length); }
        const [i, j] = o.m.e[k.e], px = pts[i][0] + (pts[j][0] - pts[i][0]) * k.t, py = pts[i][1] + (pts[j][1] - pts[i][1]) * k.t;
        x.globalAlpha = .9 * AL + .1; x.beginPath(); x.arc(px, py, 2.4, 0, 6.2832); x.fill(); x.globalAlpha = 1; });
    }
  }
  let t0 = 0;
  function fr(t) {
    const dt = RM ? 0 : Math.min(t - t0, 50); t0 = t; x.clearRect(0, 0, W, H);
    const dark = document.documentElement.dataset.theme === "dark", c = hex(getComputedStyle(document.documentElement).getPropertyValue("--acc").trim() || "#0e7490");
    O.forEach(o => draw(o, dt, dark, c));
    x.font = "600 14px ui-monospace,Consolas,monospace"; x.textAlign = "center";
    G.forEach(g => { x.font = `600 ${g.s}px ui-monospace,Consolas,monospace`; x.fillStyle = `rgba(${c.join(",")},${(dark ? .30 : .18) * AL})`;
      const L = H * 1.5, gy = ((((g.y * L - sy * g.k + H * .25 + Math.sin(t / 1800 + g.ph) * 10) % L) + L) % L) - H * .25; x.fillText(g.t, g.x * W - mx * 40 * g.k, gy); });
    if (!RM) requestAnimationFrame(fr);
  }
  addEventListener("resize", rs);
  addEventListener("pointermove", e => { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; });
  addEventListener("scroll", () => { sy = scrollY; if (RM) fr(0); }, { passive: true });
  rs(); if (!RM) requestAnimationFrame(fr);
})();
</script>
